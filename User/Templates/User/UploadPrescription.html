{% extends 'User/Head.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSure::Prescription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(to right, #4CAF50, #81C784);
            color: white;
            padding: 20px;
        }
        .container {
        background: linear-gradient(135deg, #5ebdb2, #4da0b7);
        border-radius: 12px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        color: white;
    
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            background: white;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #388E3C;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Upload File</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" id="prescription" name="prescription" required>
            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
{% endblock content %}
