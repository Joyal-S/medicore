{% extends 'User/Head.html' %}
{% block content %}

<div class="medicore-page-container" style="max-width: 500px;">
  <div class="medicore-card">
    <div class="medicore-page-header">
      <div style="font-size: 38px; color: #0284c7; margin-bottom: 8px;">
        <i class="fas fa-key"></i>
      </div>
      <h2 class="medicore-page-title">Change Password</h2>
      <p class="medicore-page-subtitle">Update your account security credentials</p>
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="medicore-form-group">
        <label class="medicore-label" for="old">Current Password <span class="text-danger">*</span></label>
        <input type="password" id="old" name="old" class="medicore-input" placeholder="Enter current password" required autocomplete="current-password">
      </div>

      <div class="medicore-form-group">
        <label class="medicore-label" for="new">New Password <span class="text-danger">*</span></label>
        <input type="password" id="new" name="new" class="medicore-input" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password">
      </div>

      <div class="medicore-form-group">
        <label class="medicore-label" for="re">Re-type New Password <span class="text-danger">*</span></label>
        <input type="password" id="re" name="re" class="medicore-input" placeholder="Repeat new password" required minlength="8" autocomplete="new-password">
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <a href="{% url 'User:myprofile' %}" class="btn-medicore-outline">
          <i class="fas fa-arrow-left"></i> Cancel
        </a>
        <button type="submit" class="btn-medicore-primary px-4 py-2">
          <i class="fas fa-lock mr-1"></i> Update Password
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock content %}
