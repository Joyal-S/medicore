{% extends 'User/Head.html' %}
{% block content %}

<style>
    /* Container Styling */
    .profile-container {
        max-width: 450px;
        margin: 50px auto;
        padding: 30px;
        background: linear-gradient(135deg, #3498db, #6dd5fa);
        border-radius: 12px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        color: white;
    }

    /* Title Styling */
    .profile-container h1, 
    .profile-container h2 {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Table Styling */
    .profile-container table {
        width: 100%;
        margin: auto;
    }

    .profile-container th {
        text-align: left;
        padding: 10px;
        font-size: 16px;
        font-weight: bold;
    }

    .profile-container td {
        padding: 10px;
    }

    /* Input Field Styling */
    .profile-container input[type="text"],
    .profile-container input[type="password"] {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.8);
        color: #2c3e50;
        transition: 0.3s ease-in-out;
    }

    .profile-container input[type="text"]:focus,
    .profile-container input[type="password"]:focus {
        background: white;
        box-shadow: 0px 0px 8px rgba(255, 255, 255, 0.5);
    }

    /* Button Styling */
    .actions {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .profile-container input[type="submit"] {
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
    }

    #submit[name="Edit"] {
        background-color: #2c3e50;
        color: white;
    }

    #submit[name="Edit"]:hover {
        background-color: #1a252f;
    }

    #submit[name="Cancel"] {
        background-color: #e74c3c;
        color: white;
    }

    #submit[name="Cancel"]:hover {
        background-color: #c0392b;
    }

</style>

<div class="profile-container">
    <h1>Shop</h1>
    <h2>Edit Password</h2>
    <form method="post">
        {% csrf_token %}
        <table>
            <tr>
                <th>Old Password</th>
                <td><input type="password" name="old" id="old"></td>
            </tr>
            <tr>
                <th>New Password</th>
                <td><input type="password" name="new" id="new"></td>
            </tr>
            <tr>
                <th>Re-Type Password</th>
                <td><input type="password" name="ren" id="ren"></td>
            </tr>
        </table>
        <div class="actions">
            <input type="submit" name="Edit" id="submit" value="Change Password">
            <input type="submit" name="Cancel" id="submit" value="Cancel">
        </div>
    </form>
</div>

</body>
</html>
{% if message %}
<script>
    alert("{{message}}");
    window.location="{% url 'User:myprofile' %}"
</script>
{% endif %}
{% endblock content %}
