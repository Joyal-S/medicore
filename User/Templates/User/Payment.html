{% extends 'User/Head.html' %}
{% block content %}

<div class="medicore-page-container" style="max-width: 620px;">
  <div class="medicore-card">
    <div class="medicore-page-header">
      <div style="font-size: 38px; color: #0284c7; margin-bottom: 8px;">
        <i class="fas fa-credit-card"></i>
      </div>
      <h2 class="medicore-page-title">Order Payment & Confirmation</h2>
      <p class="medicore-page-subtitle">Complete your transaction to finalize order fulfillment</p>
    </div>

    <!-- Amount Banner -->
    <div class="p-3 mb-4 rounded text-center" style="background: #e0f2fe; border: 1px solid #bae6fd;">
      <span class="text-muted" style="font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Amount Payable</span>
      <h2 style="font-size: 32px; font-weight: 800; color: #0284c7; margin: 4px 0 0 0;">
        ₹{{ data.booking_amount }}
      </h2>
      <small class="text-muted">Order Reference #{{ data.id }}</small>
    </div>

    <form method="POST" id="payment-form">
      {% csrf_token %}

      <div class="medicore-form-group">
        <label class="medicore-label" for="card_name">Cardholder Name <span class="text-danger">*</span></label>
        <input type="text" id="card_name" class="medicore-input" placeholder="e.g. John Doe" required autocomplete="cc-name">
      </div>

      <div class="medicore-form-group">
        <label class="medicore-label" for="card_number">Card Number <span class="text-danger">*</span></label>
        <div class="input-group">
          <input type="text" id="card_number" class="medicore-input" placeholder="XXXX XXXX XXXX XXXX" required maxlength="19" autocomplete="cc-number">
          <div class="input-group-append">
            <span class="input-group-text bg-white"><i class="far fa-credit-card text-muted"></i></span>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="medicore-form-group">
            <label class="medicore-label" for="exp_date">Expiry Date <span class="text-danger">*</span></label>
            <input type="text" id="exp_date" class="medicore-input" placeholder="MM/YY" required maxlength="5" autocomplete="cc-exp">
          </div>
        </div>
        <div class="col-md-6">
          <div class="medicore-form-group">
            <label class="medicore-label" for="cvv">CVV / CVC <span class="text-danger">*</span></label>
            <input type="password" id="cvv" class="medicore-input" placeholder="123" required maxlength="4" autocomplete="cc-csc">
          </div>
        </div>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn-medicore-primary btn-block justify-content-center py-3" style="font-size: 16px;">
          <i class="fas fa-lock mr-1"></i> Pay Securely ₹{{ data.booking_amount }}
        </button>
      </div>

      <div class="mt-3 text-center text-muted" style="font-size: 12px;">
        <i class="fas fa-shield-alt text-success mr-1"></i> 256-Bit SSL Encrypted Payment Gateway
      </div>
    </form>
  </div>
</div>

{% endblock content %}
