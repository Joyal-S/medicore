{% extends 'Doctor/Head.html' %}
{% block content %}

<div class="medicore-page-container" style="max-width: 580px;">
  <div class="medicore-card">
    <div class="medicore-page-header">
      <div style="font-size: 38px; color: #0284c7; margin-bottom: 8px;">
        <i class="fas fa-user-edit"></i>
      </div>
      <h2 class="medicore-page-title">Edit Doctor Profile</h2>
      <p class="medicore-page-subtitle">Update your professional contact credentials</p>
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="medicore-form-group">
        <label class="medicore-label" for="name">Doctor Name <span class="text-danger">*</span></label>
        <input type="text" id="name" name="name" class="medicore-input" value="{{ data.doctor_name }}" required>
      </div>

      <div class="medicore-form-group">
        <label class="medicore-label" for="contact">Contact Number <span class="text-danger">*</span></label>
        <input type="tel" id="contact" name="contact" class="medicore-input" value="{{ data.doctor_contact }}" required pattern="[0-9]{10}">
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <a href="{% url 'Doctor:myprofile' %}" class="btn-medicore-outline">
          <i class="fas fa-arrow-left"></i> Cancel
        </a>
        <button type="submit" class="btn-medicore-primary px-4 py-2">
          <i class="fas fa-save mr-1"></i> Save Profile
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock content %}
