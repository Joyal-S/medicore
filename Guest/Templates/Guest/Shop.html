{% extends 'Guest/Head.html' %}
{% block content %}

<div class="medicore-page-container" style="max-width: 650px;">
  <div class="medicore-card">
    <div class="medicore-page-header">
      <div style="font-size: 38px; color: #0284c7; margin-bottom: 8px;">
        <i class="fas fa-store-alt"></i>
      </div>
      <h2 class="medicore-page-title">Pharmacy Registration</h2>
      <p class="medicore-page-subtitle">Register your licensed pharmacy to fulfill medical orders on Medicore</p>
    </div>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="medicore-form-group">
        <label class="medicore-label" for="shop_name"><i class="fas fa-store text-muted mr-1"></i> Pharmacy / Shop Name <span class="text-danger">*</span></label>
        <input type="text" id="shop_name" name="shop_name" class="medicore-input" placeholder="e.g. City Life Pharmacy" required>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="medicore-form-group">
            <label class="medicore-label" for="email"><i class="fas fa-envelope text-muted mr-1"></i> Official Email <span class="text-danger">*</span></label>
            <input type="email" id="email" name="email" class="medicore-input" placeholder="pharmacy@medicore.com" required autocomplete="email">
          </div>
        </div>
        <div class="col-md-6">
          <div class="medicore-form-group">
            <label class="medicore-label" for="contact"><i class="fas fa-phone text-muted mr-1"></i> Contact Number <span class="text-danger">*</span></label>
            <input type="tel" id="contact" name="contact" class="medicore-input" placeholder="10-digit phone number" required pattern="[0-9]{10}">
          </div>
        </div>
      </div>

      <div class="medicore-form-group">
        <label class="medicore-label" for="address"><i class="fas fa-map-marker-alt text-muted mr-1"></i> Physical Address <span class="text-danger">*</span></label>
        <textarea id="address" name="address" class="medicore-textarea" rows="3" placeholder="Full shop address including landmark" required></textarea>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="medicore-form-group">
            <label class="medicore-label" for="photo"><i class="fas fa-image text-muted mr-1"></i> Pharmacy Logo / Front Photo <span class="text-danger">*</span></label>
            <input type="file" id="photo" name="photo" class="medicore-input" accept="image/*" required>
            <small class="text-muted">JPG, PNG, WEBP (Max 5 MB)</small>
          </div>
        </div>
        <div class="col-md-6">
          <div class="medicore-form-group">
            <label class="medicore-label" for="license"><i class="fas fa-file-contract text-muted mr-1"></i> Drug License Document <span class="text-danger">*</span></label>
            <input type="file" id="license" name="license" class="medicore-input" accept="image/*,.pdf" required>
            <small class="text-muted">Image or PDF (Max 10 MB)</small>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="medicore-form-group">
            <label class="medicore-label" for="district"><i class="fas fa-city text-muted mr-1"></i> District <span class="text-danger">*</span></label>
            <select id="district" name="district" class="medicore-select" required>
              <option value="">-- Select District --</option>
              {% for i in district %}
              <option value="{{ i.id }}">{{ i.district_name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div class="medicore-form-group">
            <label class="medicore-label" for="place"><i class="fas fa-location-arrow text-muted mr-1"></i> Place <span class="text-danger">*</span></label>
            <select id="place" name="place" class="medicore-select" required>
              <option value="">-- Select Place --</option>
            </select>
          </div>
        </div>
      </div>

      <div class="medicore-form-group">
        <label class="medicore-label" for="password"><i class="fas fa-lock text-muted mr-1"></i> Password <span class="text-danger">*</span></label>
        <input type="password" id="password" name="password" class="medicore-input" placeholder="Create a strong password (min 8 characters)" required minlength="8" autocomplete="new-password">
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4">
        <a href="{% url 'Guest:login' %}" class="btn-medicore-outline">
          <i class="fas fa-arrow-left"></i> Already Registered? Sign In
        </a>
        <button type="submit" class="btn-medicore-primary px-4 py-2">
          <i class="fas fa-store"></i> Register Pharmacy
        </button>
      </div>
    </form>
  </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
  $("#district").change(function () {
    var did = $(this).val();
    if (did) {
      $.ajax({
        url: "{% url 'Guest:ajaxplace' %}",
        data: { did: did },
        success: function (data) {
          $("#place").html(data);
        }
      });
    } else {
      $("#place").html('<option value="">-- Select Place --</option>');
    }
  });
</script>

{% endblock content %}
