{% extends 'Guest/Head.html' %}
{% block content %}
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #3db68c, #4f96cd);
    }

    .container {
        background: linear-gradient(135deg, #5ebdb2, #4da0b7);
        border-radius: 12px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        color: white;
    }


    h2 {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .form-group,
    label,
    select {
        width: 100%;
        text-align: left;
    }

    label {
        font-weight: bold;
        margin-top: 10px;
        margin-bottom: 5px;
        color: white;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: none;
        outline: none;
        margin-bottom: 15px;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.9);
        color: #333;
        transition: 0.3s ease-in-out;
        text-align: center;
    }

    input:focus,
    select:focus {
        background: white;
        box-shadow: 0px 0px 8px rgba(255, 255, 255, 0.5);
    }

    input[type="file"] {
        background: white;
        padding: 10px;
    }

    button {
        margin-top: 15px;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: #5db080;
        color: white;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #1c9230;
    }
</style>

<div class="container">
    <h2>Doctor Registration</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="contact">Contact</label>
            <input type="tel" id="contact" name="contact" placeholder="Enter your contact number" required>
        </div>

        <div class="form-group">
            <label for="photo">Photo</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>
        </div>

        <div class="form-group">
            <label for="license">License</label>
            <input type="file" id="license" name="license" accept="image/*" required>
        </div>

        <label for="district">District</label>
        <select id="district" name="district" required>
            <option>----select-----</option>   
            {% for i in district %}
            <option value="{{i.id}}">{{i.district_name}}</option>
            {% endfor %}
        </select>

        <label for="place">Place</label>
        <select id="place" name="place" required>
            <option>----select-----</option>   
        </select>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit">Register</button>
    </form>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#district").change(function () {
        var did = $(this).val();
        var ur = "{% url 'Guest:ajaxplace' %}"
        $.ajax({
            url: ur,
            data: { did: did },
            success: function (data) {
                $("#place").html(data);
            },
        });
    });
</script>
{% endblock content %}
