{% extends 'Guest/Head.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSure::User Registration</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #5ebdb2, #4da0b7);
            margin: 0;
            padding: 0;
        }
    
        .container {
        background: linear-gradient(135deg, #5ebdb2, #4da0b7);
        border-radius: 12px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        color: white;
    }

    
        h2 {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            color: #2c3e50;
            margin-bottom: 25px;
        }
    
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
    
        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
    
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #34495e;
        }
    
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        input[type="file"],
        select,
        textarea {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }
    
        input:focus,
        select:focus,
        textarea:focus {
            border-color: #5ebdb2;
            box-shadow: 0 0 8px rgba(94, 189, 178, 0.5);
            background-color: #fff;
        }
    
        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #2c3e50;
            color: white;
            transition: background-color 0.3s ease;
            margin-right: 10px;
        }
    
        button:hover {
            background-color: #1a252f;
        }
    
        .cancel-button {
            background-color: #e74c3c;
        }
    
        .cancel-button:hover {
            background-color: #c0392b;
        }
    
        .form-group:last-child {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
    </style>
    
</head>
<body>

    <div class="container">
        <h2>User Registration</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>
        
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter a valid email address" required>
            </div>
        
            <div class="form-group">
                <label for="contact">Contact:</label>
                <input type="tel" id="contact" name="contact" placeholder="Enter your contact number" required>
            </div>
        
            <div class="form-group">
                <label for="address">Address:</label>
                <textarea id="address" name="address" rows="4" placeholder="Enter your full address" required></textarea>
            </div>
        
            <div class="form-group">
                <label for="district">District:</label>
                <select id="district" name="district" required>
                    <option value="">---- Select District ----</option>
                    {% for i in district %}
                    <option value="{{i.id}}">{{i.district_name}}</option>
                    {% endfor %}
                </select>
            </div>
        
            <div class="form-group">
                <label for="place">Place:</label>
                <select id="place" name="place" required>
                    <option value="">---- Select Place ----</option>
                </select>
            </div>
        
            <div class="form-group">
                <label for="photo">Photo:</label>
                <input type="file" id="photo" name="photo">
            </div>
        
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            </div>
        
            <div class="form-group">
                <button type="submit">Submit</button>
                <button type="reset" class="cancel-button">Cancel</button>
            </div>
        </form>
        
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        $("#district").change(function () {
            var did = $(this).val();
            var ur = "{% url 'Guest:ajaxplace' %}"
            $.ajax({
                url: ur,
                data: { did: did, },
                success: function (data) {
                    $("#place").html(data);
                },
            });
        });
    </script>
</body>
</html>
{% endblock content %}
