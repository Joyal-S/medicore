<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Medicore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { max-width: 520px; width: 90%; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); padding: 40px 30px; text-align: center; }
        .error-code { font-size: 5rem; font-weight: 800; color: #dc2626; line-height: 1; margin-bottom: 15px; }
        .btn-medicore { background-color: #0d9488; color: white; font-weight: 600; padding: 10px 24px; border-radius: 8px; border: none; text-decoration: none; }
        .btn-medicore:hover { background-color: #0f766e; color: white; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="mb-3 text-danger">
            <i class="fa fa-server fa-3x"></i>
        </div>
        <div class="error-code">500</div>
        <h4 class="fw-bold mb-2">Unexpected Server Issue</h4>
        <p class="text-muted mb-4">Our healthcare servers encountered an unexpected condition while processing your request. Please try again shortly or contact support.</p>
        <a href="/Guest/index/" class="btn-medicore d-inline-block">
            <i class="fa fa-home me-2"></i>Return to Homepage
        </a>
    </div>
</body>
</html>
