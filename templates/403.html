<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Forbidden | Medicore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { max-width: 520px; width: 90%; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); padding: 40px 30px; text-align: center; }
        .error-code { font-size: 5rem; font-weight: 800; color: #ef4444; line-height: 1; margin-bottom: 15px; }
        .btn-medicore { background-color: #0d9488; color: white; font-weight: 600; padding: 10px 24px; border-radius: 8px; border: none; text-decoration: none; }
        .btn-medicore:hover { background-color: #0f766e; color: white; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="mb-3 text-danger">
            <i class="fa fa-shield-alt fa-3x"></i>
        </div>
        <div class="error-code">403</div>
        <h4 class="fw-bold mb-2">Access Forbidden</h4>
        <p class="text-muted mb-4">You do not have permission to access this resource or medical record. Please log in with an authorized account or contact support.</p>
        <div class="d-flex gap-2 justify-content-center">
            <a href="/Guest/login/" class="btn btn-outline-secondary">
                <i class="fa fa-sign-in-alt me-1"></i>Log In
            </a>
            <a href="/Guest/index/" class="btn-medicore">
                <i class="fa fa-home me-1"></i>Homepage
            </a>
        </div>
    </div>
</body>
</html>
