{% extends 'Shop/Head.html' %}
{% block content %}

<style>
    /* Profile Container */
    .profile-container {
        max-width: 500px;
        margin: 50px auto;
        padding: 25px;
        background: linear-gradient(135deg, #3498db, #6dd5fa);
        border-radius: 12px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        color: white;
    }

    /* Title Styling */
    .profile-container h1, 
    .profile-container h2 {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Table Styling */
    .profile-container table {
        width: 100%;
        margin: auto;
    }

    .profile-container th {
        text-align: left;
        padding: 10px;
        font-size: 16px;
        font-weight: bold;
    }

    .profile-container td {
        padding: 10px;
    }

    /* Input Field Styling */
    .profile-container input[type="text"] {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.8);
        color: #2c3e50;
        transition: 0.3s ease-in-out;
    }

    .profile-container input[type="text"]:focus {
        background: white;
        box-shadow: 0px 0px 8px rgba(255, 255, 255, 0.5);
    }

    /* Button Styling */
    .profile-container button {
        margin-top: 15px;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        background-color: #2c3e50;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
    }

    .profile-container button:hover {
        background-color: #1a252f;
    }

</style>

    <div class="profile-container">
        <h1>Shop</h1>
        <h2>My Profile</h2>
        <form method="post" >
            {% csrf_token %}
        <table>
            <tr>
                <th >Name</th>
                <td><input type="text" id="place" name="name" value="{{shop.shop_name}}"></td>
            </tr>
            <tr>
                <th>Email</th>
                <td><input type="text" id="place" name="email" value="{{shop.shop_email}}"></td>
            </tr>
            <tr>
                <th>Contact</th>
                <td><input type="text" id="place" name="contact" value="{{shop.shop_contact}}"></td>
            </tr>
            <tr>
                <th>Address</th>
                <td><input type="text" id="place" name="address" value="{{shop.shop_address}}"></td>
            </tr>
           <td colspan="2" align="center"><button type="submit">edit</button></td> 
        </table>
    </form>
    </div>
{% endblock content %}
