{% extends 'Shop/Head.html' %}
{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-bold"><i class="fa fa-user-edit text-primary me-2"></i>Edit Pharmacy Profile</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="shop_name" class="form-label fw-semibold">Pharmacy / Store Name <span class="text-danger">*</span></label>
                            <input type="text" id="shop_name" name="name" class="form-control" value="{{ shop.shop_name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="shop_email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" id="shop_email" name="email" class="form-control" value="{{ shop.shop_email }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="shop_contact" class="form-label fw-semibold">Phone / Contact Number <span class="text-danger">*</span></label>
                            <input type="tel" id="shop_contact" name="contact" class="form-control" value="{{ shop.shop_contact }}" required>
                        </div>

                        <div class="mb-4">
                            <label for="shop_address" class="form-label fw-semibold">Physical Address <span class="text-danger">*</span></label>
                            <textarea id="shop_address" name="address" class="form-control" rows="3" required>{{ shop.shop_address }}</textarea>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{% url 'Shop:myprofile' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="fa fa-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
