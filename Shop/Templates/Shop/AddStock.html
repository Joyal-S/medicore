{% extends 'Shop/Head.html' %}
{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom py-3">
                    <div class="d-flex align-items-center">
                        <i class="fa fa-cubes text-primary fs-4 me-2"></i>
                        <h4 class="mb-0 fw-bold">Add Inventory Stock</h4>
                    </div>
                    {% if medicine %}
                    <p class="text-muted small mb-0 mt-1">Medicine: <strong class="text-dark">{{ medicine.medicine_name }}</strong></p>
                    {% endif %}
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="stock_qty" class="form-label fw-semibold">Quantity to Add (Units) <span class="text-danger">*</span></label>
                            <input type="number" id="stock_qty" name="stock_qty" min="1" step="1" class="form-control form-control-lg" placeholder="e.g. 50" required autofocus>
                            <div class="form-text">Enter the number of physical medicine units received in this batch.</div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end mt-4">
                            <a href="{% url 'Shop:medicine' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="fa fa-plus-circle me-1"></i> Add Stock
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
