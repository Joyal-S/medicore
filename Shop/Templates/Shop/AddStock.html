{% extends 'Shop/Head.html' %}
{% block content %}

<style>
    /* Container Styling */
    .container {
        
        background: linear-gradient(135deg, #73c8a6, #00c6ff);
        border-radius: 12px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        color: white;
    }

    /* Form Title */
    .container h2 {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Table Styling */
    .container table {
        width: 100%;
        margin: auto;
        color: black;
    }

    .container td {
        padding: 10px;
        font-size: 16px;
    }

    .container label {
        font-weight: bold;
    }

    /* Input Styling */
    .container input[type="number"] {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: none;
        outline: none;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.9);
        transition: 0.3s ease-in-out;
    }

    .container input:focus {
        background: white;
        box-shadow: 0px 0px 8px rgba(255, 255, 255, 0.5);
    }

    /* Button Styling */
    .container button {
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: #2c3e50;
        color: white;
        transition: background 0.3s;
    }

    .container button:hover {
        background-color: #1a252f;
    }

</style>

<div class="container">
    <h2>Add Stock</h2>
    <form method="POST">
        {% csrf_token %}
        <table>
            <tr>
                <td><label for="stock_qty">Stock Quantity:</label></td>
                <td><input type="number" id="stock_qty" name="stock_qty" min="1" required></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <button type="submit">Add Stock</button>
                </td>
            </tr>
        </table>
    </form>
</div>

{% endblock content %}
