{% extends 'Shop/Head.html' %}
{% block content %}

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom py-3">
                    <h5 class="mb-0 fw-bold"><i class="fa fa-key text-primary me-2"></i>Change Pharmacy Password</h5>
                </div>
                <div class="card-body p-4">
                    {% if message %}
                    <div class="alert alert-info alert-dismissible fade show" role="alert">
                        <i class="fa fa-info-circle me-1"></i> {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="old" class="form-label fw-semibold">Current Password <span class="text-danger">*</span></label>
                            <input type="password" id="old" name="old" class="form-control" placeholder="Enter current password" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="new" class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
                            <input type="password" id="new" name="new" class="form-control" placeholder="At least 8 chars, 1 uppercase, 1 number" required>
                            <div class="form-text">Must be at least 8 characters long with uppercase, lowercase, and numbers.</div>
                        </div>

                        <div class="mb-4">
                            <label for="ren" class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
                            <input type="password" id="ren" name="ren" class="form-control" placeholder="Re-type new password" required>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{% url 'Shop:myprofile' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" name="Edit" class="btn btn-primary px-4 fw-semibold">
                                <i class="fa fa-check-circle me-1"></i> Update Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}
