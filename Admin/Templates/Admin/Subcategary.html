<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSure::SubCategory</title>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <table border="1" align="center">
            <tr>
                <td>Category</td>
                <td>
                    <select name="sel_categary" required>
                        <option value="">----select-----</option> 
                        {% for i in categary %}
                        <option {% if i.id == dis.categary.id %}selected{% endif %} value="{{i.id}}">{{i.categary_name}}</option>
                        {% endfor %}
                    </select>
                </td>
            </tr> 
            <tr>
                <th>Sub Name</th>
                <td><input type="text" id="name" name="name" value="{{dis.scategary_name}}" required></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><button type="submit">Add SubCategory</button></td>
            </tr>
        </table>
    </form>
    <br>
    <table border="1" align="center">
        <tr>
            <td>#</td>
            <td>Category</td>
            <td>Sub Category</td>
            <td colspan="2">Action</td>
        </tr>
        {% for i in scategary %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.categary.categary_name}}</td>
            <td>{{i.scategary_name}}</td>
            <td><a href="{% url 'Admin:edisubcategary' i.id %}">Edit</a></td>
            <td>
                <form method="POST" action="{% url 'Admin:deletsub' i.id %}" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this subcategory?');">
                    {% csrf_token %}
                    <button type="submit" style="background:#e74c3c;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>   
</body>
</html>
