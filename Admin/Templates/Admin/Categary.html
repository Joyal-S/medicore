<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSure::Category</title>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <table border="1" align="center">
            <tr>
                <th>Category Name</th>
                <td><input type="text" id="Input" name="Input" value="{{dis.categary_name}}" required></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><button type="submit">Add Category</button></td>
            </tr>
        </table>
    </form>
    <br>
    <table border="1" align="center">
        <tr>
            <td>#</td>
            <td>Category</td>
            <td colspan="2">Action</td>
        </tr>
        {% for i in categary %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.categary_name}}</td>
            <td><a href="{% url 'Admin:editcategary' i.id %}">Edit</a></td>
            <td>
                <form method="POST" action="{% url 'Admin:deletcategary' i.id %}" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this category?');">
                    {% csrf_token %}
                    <button type="submit" style="background:#e74c3c;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
