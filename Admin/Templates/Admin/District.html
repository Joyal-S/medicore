{% extends 'Admin/Head.html' %}
{% block content %}

<div class="page-wrapper">
    <div class="container-fluid">
        <div class="row">
            <!-- District Form Card -->
            <div class="col-lg-6 mx-auto">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title text-center">Add / Edit District</h4>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="districtInput">District Name</label>
                                <input type="text" class="form-control" id="districtInput" name="districtInput" value="{{ dis.district_name }}" placeholder="Enter district name" required>
                            </div>
                            <div class="form-group text-center">
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- District Table -->
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title text-center">District List</h4>
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover">
                                <thead class="thead-dark">
                                    <tr>
                                        <th>#</th>
                                        <th>District</th>
                                        <th colspan="2" class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for i in district %}
                                    <tr>
                                        <td>{{ forloop.counter }}</td>
                                        <td>{{ i.district_name }}</td>
                                        <td class="text-center">
                                            <a href="{% url 'Admin:editdistrict' i.id %}" class="btn btn-warning btn-sm">Edit</a>
                                        </td>
                                        <td class="text-center">
                                            <form method="POST" action="{% url 'Admin:deletdistrict' i.id %}" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this district?');">
                                                {% csrf_token %}
                                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                            </form>
                                        </td>
                                    </tr>
                                    {% empty %}
                                    <tr>
                                        <td colspan="4" class="text-center">No districts found.</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

{% endblock %}
