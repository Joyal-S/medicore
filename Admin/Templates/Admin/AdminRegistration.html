<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSure::AdminRegistration</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f4f7f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        table {
            width: 90%;
            margin: 40px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        a {
            color: #007BFF;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Admin Registration</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="photo">Photo</label>
            <input type="file" id="photo" name="photo" >
        </div>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name"  placeholder="Enter Name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"  placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="text" id="password" name="password"  placeholder="Enter your password" required>
        </div>
        <button type="submit">Register</button>
    </form>
</div>

<table>
    <tr style="background-color: #007BFF; color: white;">
        <th>#</th>
        <th>Photo</th>
        <th>Name</th>
        <th>Email</th>
        <th>Password</th>
        <th colspan="2">Actions</th>
    </tr>
    {% for i in registration %}
    <tr>
        <td>{{ forloop.counter }}</td>
        <td>
            {% if i.registration_photo %}
                <img src="{{ i.registration_photo.url }}" alt="Photo" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
            {% else %}
                No Photo
            {% endif %}
        </td>
        <td>{{ i.registration_name }}</td>
        <td>{{ i.registration_email }}</td>
        <td>{{ i.registration_password }}</td>
        <td><a href="{% url 'Admin:deletregister' i.id %}">Delete</a></td>
        <td><a href="{% url 'Admin:editregister' i.id %}">Edit</a></td>
    </tr>
    {% endfor %}
</table>


</body>
</html>
