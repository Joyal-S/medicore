{% extends 'Admin/Head.html' %}
{% block content %}
<style>
    /* Container Styling */
    .profile-container {
        max-width: 450px;
        margin: 50px auto;
        padding: 30px;
        background: linear-gradient(135deg, #3498db, #6dd5fa);
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        color: white;
    }

    /* Titles */
    .profile-container h1, 
    .profile-container h2 {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Table Styling */
    .profile-container table {
        width: 100%;
        margin-top: 10px;
        border-spacing: 0 10px;
    }

    .profile-container th {
        text-align: left;
        padding: 10px;
        font-size: 16px;
        font-weight: bold;
    }

    .profile-container td {
        padding: 10px;
    }

    /* Input Styling */
    .profile-container input[type="password"] {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.85);
        color: #2c3e50;
        transition: 0.3s ease-in-out;
    }

    .profile-container input[type="password"]:focus {
        background: white;
        box-shadow: 0px 0px 8px rgba(255, 255, 255, 0.5);
    }

    /* Buttons Container */
    .actions {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    /* Buttons Styling */
    .btn {
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s, transform 0.2s ease-in-out;
    }

    .btn-edit {
        background-color: #2c3e50;
        color: white;
    }

    .btn-edit:hover {
        background-color: #1a252f;
        transform: scale(1.05);
    }

    .btn-cancel {
        background-color: #e74c3c;
        color: white;
    }

    .btn-cancel:hover {
        background-color: #c0392b;
        transform: scale(1.05);
    }
</style>

<div class="profile-container">
    <h1>Admin</h1>
    <h2>Edit Password</h2>
    <form method="post">
        {% csrf_token %}
        <table>
            <tr>
                <th>Old Password</th>
                <td><input type="password" name="old" id="old"></td>
            </tr>
            <tr>
                <th>New Password</th>
                <td><input type="password" name="new" id="new"></td>
            </tr>
            <tr>
                <th>Re-Type Password</th>
                <td><input type="password" name="ren" id="ren"></td>
            </tr>
        </table>
        <div class="actions">
            <input type="submit" class="btn btn-edit" name="Edit" value="Change Password">
            <input type="submit" class="btn btn-cancel" name="Cancel" value="Cancel">
        </div>
    </form>
</div>

{% if message %}
<script>
    alert("{{ message }}");
    window.location.href = "{% url 'Admin:myprofile' %}";
</script>
{% endif %}
{% endblock %}
